<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
}

body {
  font-family: "Merriweather", Georgia, serif;
  text-align: center;
}

.precio {
  margin: 0;
  padding: 0;
  line-height: 18px;
  font-size: 14px;
  font-weight: 700;
  color: #000000;
}

.numero {
  font-size: 18px;
  font-weight: 700;
  color: #d71920;
}

</style>

</head>

<body>

<div class="precio">
  PRECIO UNITARIO:
  <span class="numero" id="unitario">CARGANDO...</span>
</div>

<div class="precio">
  PRECIO POR MAYOR:
  <span class="numero" id="mayorista">CARGANDO...</span>
</div>


<script>

/* =========================================
   CONFIGURACIÓN
========================================= */

const ID_GOOGLE_SHEET =
  "1XKYCHe76ACgqMxuI2pZabAKOC-s2ZudrzL4cGhRzS8g";


/* =========================================
   MOSTRAR PRECIO
========================================= */

window.recibirPrecioDesdeSheet = function(datos) {

  try {

    if (
      !datos ||
      !datos.table ||
      !datos.table.rows ||
      datos.table.rows.length === 0
    ) {

      mostrarNoDisponible();

      return;

    }

    var fila =
      datos.table.rows[0].c;

    var unitario =
      fila[0] && fila[0].v != null
        ? fila[0].v
        : "";

    var mayorista =
      fila[1] && fila[1].v != null
        ? fila[1].v
        : "";

    if (
      unitario !== "" &&
      mayorista !== ""
    ) {

      document.getElementById("unitario").textContent =
        " Bs. " + unitario;

      document.getElementById("mayorista").textContent =
        " Bs. " + mayorista;

    } else {

      mostrarNoDisponible();

    }

  } catch (error) {

    mostrarNoDisponible();

  }

};


/* =========================================
   SIN PRECIO
========================================= */

function mostrarNoDisponible() {

  document.getElementById("unitario").textContent =
    "No disponible";

  document.getElementById("mayorista").textContent =
    "No disponible";

}


/* =========================================
   OBTENER CÓDIGO
========================================= */

var codigo =
  new URLSearchParams(
    window.location.search
  ).get("codigo");


/* =========================================
   CONSULTAR GOOGLE SHEETS
========================================= */

if (codigo) {

  var script =
    document.createElement("script");

  var consulta =
    "select C,D where A = '" +
    String(codigo)
      .replace(/'/g, "''") +
    "'";

  script.src =
    "https://docs.google.com/spreadsheets/d/" +
    ID_GOOGLE_SHEET +
    "/gviz/tq" +
    "?tqx=responseHandler:recibirPrecioDesdeSheet" +
    "&tq=" +
    encodeURIComponent(consulta) +
    "&headers=1" +
    "&nocache=" +
    Date.now();

  document.body.appendChild(script);

} else {

  mostrarNoDisponible();

}

</script>

</body>

</html>
