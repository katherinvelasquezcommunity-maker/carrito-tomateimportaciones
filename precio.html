<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Precio - TOMATE IMPORTACIONES</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: auto;
      min-height: 0;
      background: transparent !important;
      overflow: hidden;
    }

    body {
      font-family: "Merriweather", serif;
    }

    .precios {
      width: 100%;
      margin: 0 !important;
      padding: 0 !important;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 0;

      background: transparent !important;
    }

    .precio-linea {
      width: 100%;

      margin: 0 !important;
      padding: 0 !important;

      text-align: center;

      font-family: "Merriweather", serif;
      font-size: 14px;
      line-height: 1.15;
      font-weight: 700;

      color: #000000;

      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .precio-numero {
      color: #d71920;
      font-weight: 700;
      white-space: nowrap;
    }

  </style>

</head>

<body>

  <div class="precios">

```
<div class="precio-linea">
  PRECIO UNITARIO:
  <span class="precio-numero" id="precioUnitario"></span>
</div>

<div class="precio-linea">
  PRECIO POR MAYOR:
  <span class="precio-numero" id="precioMayorista"></span>
</div>
```

  </div>

  <script>

    const parametros = new URLSearchParams(
      window.location.search
    );

    const unitario =
      parametros.get("unitario") || "";

    const mayorista =
      parametros.get("mayorista") || "";

    document.getElementById("precioUnitario").textContent =
      "Bs. " + unitario;

    document.getElementById("precioMayorista").textContent =
      "Bs. " + mayorista;

  </script>

</body>

</html>
