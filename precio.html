<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}

.precio {
  line-height: 18px;
}

.numero {
  color: red;
}
</style>

</head>

<body>

<div class="precio">
  PRECIO UNITARIO: <span class="numero" id="unitario"></span>
</div>

<div class="precio">
  PRECIO POR MAYOR: <span class="numero" id="mayorista"></span>
</div>

<script>
const datos = new URLSearchParams(window.location.search);

document.getElementById("unitario").textContent =
  "Bs. " + (datos.get("unitario") || "");

document.getElementById("mayorista").textContent =
  "Bs. " + (datos.get("mayorista") || "");
</script>

</body>
</html>
