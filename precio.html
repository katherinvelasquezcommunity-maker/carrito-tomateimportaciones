<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Precio - TOMATE IMPORTACIONES</title>

<link
href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
rel="stylesheet"
>

<style>

html,
body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100%;
  background: transparent !important;
  overflow: hidden !important;
}

body {
  font-family: "Merriweather", serif;
}

.precios {
  width: 100%;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  text-align: center;
}

.precio {
  width: 100%;
  margin: 0 !important;
  padding: 0 !important;

  font-family: "Merriweather", serif;
  font-size: 14px;
  line-height: 16px;
  font-weight: 700;

  color: #000000;

  background: transparent !important;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
}

.numero {
  color: #d71920;
  font-weight: 700;
}

</style>

</head>

<body>

<div class="precios">

  <div class="precio">
    PRECIO UNITARIO:
    <span class="numero" id="unitario"></span>
  </div>

  <div class="precio">
    PRECIO POR MAYOR:
    <span class="numero" id="mayorista"></span>
  </div>

</div>

<script>

const datos = new URLSearchParams(window.location.search);

const unitario = datos.get("unitario") || "";

const mayorista = datos.get("mayorista") || "";

document.getElementById("unitario").textContent =
  " Bs. " + unitario;

document.getElementById("mayorista").textContent =
  " Bs. " + mayorista;

</script>

</body>

</html>
