<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito TOMATE IMPORTACIONES</title>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: white;
}

.contenedor {
  max-width: 700px;
  margin: auto;
}

h1 {
  color: #b00000;
}

.producto {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}

.precio {
  color: #b00000;
  font-weight: bold;
}

.estado {
  text-align: center;
  padding: 30px;
}

button {
  padding: 12px 20px;
  background: #b00000;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>
TOMATE IMPORTACIONES S.R.L.
</h1>

<p>
Calidad importada, confianza garantizada
</p>

<div id="resultado" class="estado">
🔄 Cargando producto...
</div>

</div>


<script>

var URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbx0V_7ievbxYu5OGNcjJf59M3LXRaJbrji67M5JPnWrFkZHI7Mxp7tGXEo4oTblzDV_4g/exec";


function recibirProductoCarrito(datos) {

  console.log(
    "RESPUESTA DE APPS SCRIPT:",
    datos
  );


  var resultado =
    document.getElementById(
      "resultado"
    );


  if (
    datos &&
    datos.encontrado === true
  ) {

    resultado.innerHTML =

      '<div class="producto">' +

      '<h2>' +
      datos.producto +
      '</h2>' +

      '<p>' +
      'Código: ' +
      datos.codigo +
      '</p>' +

      '<p>' +
      'Precio unitario: ' +

      '<span class="precio">' +
      'Bs. ' +
      datos.unitario +
      '</span>' +

      '</p>' +

      '<p>' +
      'Precio mayorista: ' +

      '<span class="precio">' +
      'Bs. ' +
      datos.mayorista +
      '</span>' +

      '</p>' +

      '<hr>' +

      '<p>' +
      '✅ CONEXIÓN CORRECTA' +
      '</p>' +

      '</div>';

  } else {

    resultado.innerHTML =

      '<div class="estado">' +

      '❌ Producto no encontrado.' +

      '</div>';

  }

}


function cargarProducto() {

  var parametros =
    new URLSearchParams(
      window.location.search
    );


  var codigo =
    parametros.get("codigo");


  if (!codigo) {

    document.getElementById(
      "resultado"
    ).innerHTML =

      '<div class="estado">' +

      '❌ No se recibió ningún código de producto.' +

      '</div>';

    return;

  }


  var script =
    document.createElement(
      "script"
    );


  script.src =
    URL_APPS_SCRIPT +

    "?accion=precio" +

    "&codigo=" +
    encodeURIComponent(
      codigo
    ) +

    "&callback=recibirProductoCarrito" +

    "&nocache=" +
    Date.now();


  script.onerror =
    function() {

      document.getElementById(
        "resultado"
      ).innerHTML =

        '<div class="estado">' +

        '❌ ERROR DE CONEXIÓN CON APPS SCRIPT.<br><br>' +

        '<button onclick="location.reload()">' +

        '🔄 REINTENTAR' +

        '</button>' +

        '</div>';

    };


  document.head.appendChild(
    script
  );

}


cargarProducto();

</script>

</body>
</html>
