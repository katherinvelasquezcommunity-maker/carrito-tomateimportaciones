<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mi carrito - TOMATE IMPORTACIONES S.R.L.</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .contenedor {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    /* =========================
       ENCABEZADO
    ========================= */

    .encabezado {
      text-align: center;
      margin-bottom: 25px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 30px;
      color: #b71c1c;
    }

    .encabezado p {
      margin: 8px 0 0;
      color: #666;
      font-size: 15px;
    }

    /* =========================
       MENSAJE MAYORISTA
    ========================= */

    .mensaje-mayorista {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
    }

    .mayorista-activo {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .mayorista-inactivo {
      background: #fff8e1;
      color: #8a6500;
      border: 1px solid #ffe082;
    }

    /* =========================
       PRODUCTO
    ========================= */

    .producto {
      display: flex;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .imagen-producto {
      width: 105px;
      height: 105px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 12px;
      background: #f5f5f5;
    }

    .sin-imagen {
      width: 105px;
      height: 105px;
      flex-shrink: 0;
      border-radius: 12px;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .informacion-producto {
      flex: 1;
      min-width: 0;
    }

    .nombre-producto {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* =========================
       PRECIOS
    ========================= */

    .precios {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .precio-linea {
      font-size: 14px;
    }

    .precio-unitario {
      color: #333;
    }

    .precio-mayorista {
      color: #b71c1c;
      font-weight: bold;
    }

    .ahorro {
      display: inline-block;
      margin-top: 3px;
      padding: 4px 8px;
      border-radius: 5px;
      background: #fce4ec;
      color: #b71c1c;
      font-size: 12px;
      font-weight: bold;
    }

    .precio-aplicado {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 7px;
      background: #f5f5f5;
      font-size: 14px;
    }

    .precio-aplicado strong {
      color: #b71c1c;
      font-size: 16px;
    }

    /* =========================
       CANTIDAD
    ========================= */

    .controles {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .boton-cantidad {
      width: 34px;
      height: 34px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 7px;
      font-size: 20px;
      cursor: pointer;
    }

    .boton-cantidad:hover {
      background: #f5f5f5;
    }

    .numero-cantidad {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    /* =========================
       SUBTOTAL
    ========================= */

    .lado-derecho {
      min-width: 125px;
      text-align: right;
    }

    .subtotal {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .boton-eliminar {
      border: none;
      background: transparent;
      color: #d32f2f;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       VACÍO
    ========================= */

    .carrito-vacio {
      text-align: center;
      padding: 45px 20px;
      color: #777;
    }

    .carrito-vacio .icono {
      font-size: 50px;
      margin-bottom: 10px;
    }

    /* =========================
       RESUMEN
    ========================= */

    .resumen {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #e5e5e5;
    }

    .fila-resumen {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 10px 0;
      font-size: 15px;
    }

    .ahorro-total {
      color: #2e7d32;
      font-weight: bold;
    }

    .fila-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-size: 23px;
      font-weight: bold;
    }

    .monto-total {
      color: #b71c1c;
    }

    /* =========================
       FORMULARIO
    ========================= */

    .seccion {
      margin-top: 30px;
      padding: 22px;
      border: 1px solid #e1e1e1;
      border-radius: 14px;
      background: #fff;
    }

    .titulo-seccion {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .campo {
      margin-bottom: 16px;
    }

    .campo label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      border-color: #b71c1c;
    }

    .campo textarea {
      min-height: 90px;
      resize: vertical;
    }

    .obligatorio {
      color: #d32f2f;
    }

    /* =========================
       DELIVERY
    ========================= */

    #datosDelivery {
      display: none;
      padding-top: 5px;
    }

    #datosTienda {
      display: none;
    }

    /* =========================
       BOTONES
    ========================= */

    .botones-finales {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .boton-final {
      flex: 1;
      min-width: 200px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .boton-seguir {
      background: #eeeeee;
      color: #333;
    }

    .boton-seguir:hover {
      background: #e0e0e0;
    }

    .boton-finalizar {
      background: #25D366;
      color: white;
    }

    .boton-finalizar:hover {
      background: #20bd5a;
    }

    /* =========================
       CHECKBOX
    ========================= */

    .confirmacion {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .confirmacion input {
      margin-top: 3px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {

      body {
        padding: 10px;
      }

      .contenedor {
        padding: 16px;
        border-radius: 12px;
      }

      .producto {
        flex-wrap: wrap;
      }

      .imagen-producto,
      .sin-imagen {
        width: 80px;
        height: 80px;
      }

      .informacion-producto {
        width: calc(100% - 100px);
      }

      .lado-derecho {
        width: 100%;
        text-align: left;
        padding-left: 98px;
      }

      .fila-total {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

<div class="contenedor">

  <!-- =========================
       ENCABEZADO
  ========================== -->

  <div class="encabezado">

    <h1>🛒 Mi carrito</h1>

    <p>
      TOMATE IMPORTACIONES S.R.L.
    </p>

  </div>


  <!-- =========================
       PRODUCTOS
  ========================== -->

  <div id="carrito">

    <div class="carrito-vacio">

      <div class="icono">
        🔄
      </div>

      <h2>
        Cargando producto...
      </h2>

    </div>

  </div>


  <!-- =========================
       RESUMEN Y FORMULARIO
  ========================== -->

  <div id="contenidoCompra" style="display:none;">


    <!-- MENSAJE MAYORISTA -->

    <div id="mensajeMayorista"
         class="mensaje-mayorista">
    </div>


    <!-- RESUMEN -->

    <div class="resumen">

      <div class="fila-resumen">

        <span>
          Total de unidades
        </span>

        <strong id="totalUnidades">
          0
        </strong>

      </div>


      <div class="fila-resumen">

        <span>
          Ahorro por precio mayorista
        </span>

        <strong
          id="ahorroTotal"
          class="ahorro-total">
          Bs 0.00
        </strong>

      </div>


      <div class="fila-total">

        <span>
          Total
        </span>

        <span class="monto-total">
          Bs <span id="total">0.00</span>
        </span>

      </div>

    </div>


    <!-- =========================
         DATOS DEL CLIENTE
    ========================== -->

    <div class="seccion">

      <h2 class="titulo-seccion">
        👤 Datos del cliente
      </h2>


      <div class="campo">

        <label for="nombreCliente">
          Nombre completo
          <span class="obligatorio">*</span>
        </label>

        <input
          type="text"
          id="nombreCliente"
          placeholder="Ej.: María Fernández"
          autocomplete="name"
        >

      </div>


      <div class="campo">

        <label for="whatsappCliente">
          WhatsApp
          <span class="obligatorio">*</span>
        </label>

        <input
          type="tel"
          id="whatsappCliente"
          placeholder="Ej.: 70000000"
          autocomplete="tel"
        >

      </div>


      <div class="campo">

        <label for="otroContacto">
          Otro número de contacto
        </label>

        <input
          type="tel"
          id="otroContacto"
          placeholder="Opcional"
        >

      </div>


      <div class="campo">

        <label for="correoCliente">
          Correo electrónico
        </label>

        <input
          type="email"
          id="correoCliente"
          placeholder="Opcional"
          autocomplete="email"
        >

      </div>

    </div>


    <!-- =========================
         ENTREGA
    ========================== -->

    <div class="seccion">

      <h2 class="titulo-seccion">
        🚚 ¿Cómo deseas recibir tu pedido?
      </h2>


      <div class="campo">

        <label for="tipoEntrega">
          Método de entrega
          <span class="obligatorio">*</span>
        </label>

        <select id="tipoEntrega">

          <option value="">
            Selecciona una opción
          </option>

          <option value="Delivery">
            🚚 Delivery
          </option>

          <option value="Entrega en tienda">
            🏪 Entrega en tienda
          </option>

        </select>

      </div>


      <!-- DATOS DELIVERY -->

      <div id="datosDelivery">

        <div class="campo">

          <label for="ciudad">
            Ciudad
            <span class="obligatorio">*</span>
          </label>

          <input
            type="text"
            id="ciudad"
            placeholder="Ej.: Santa Cruz de la Sierra"
          >

        </div>


        <div class="campo">

          <label for="zona">
            Zona / Barrio
            <span class="obligatorio">*</span>
          </label>

          <input
            type="text"
            id="zona"
            placeholder="Ej.: Equipetrol"
          >

        </div>


        <div class="campo">

          <label for="direccion">
            Dirección
            <span class="obligatorio">*</span>
          </label>

          <input
            type="text"
            id="direccion"
            placeholder="Calle, avenida, número..."
          >

        </div>


        <div class="campo">

          <label for="referencia">
            Referencia
          </label>

          <input
            type="text"
            id="referencia"
            placeholder="Ej.: Cerca de..."
          >

        </div>


        <div class="campo">

          <label for="recibe">
            ¿Quién recibirá el pedido?
            <span class="obligatorio">*</span>
          </label>

          <input
            type="text"
            id="recibe"
            placeholder="Nombre de quien recibirá"
          >

        </div>

      </div>


      <!-- DATOS TIENDA -->

      <div id="datosTienda">

        <div class="campo">

          <label for="personaRecoge">
            Nombre de quien recogerá
            <span class="obligatorio">*</span>
          </label>

          <input
            type="text"
            id="personaRecoge"
            placeholder="Nombre completo"
          >

        </div>

      </div>

    </div>


    <!-- =========================
         OBSERVACIONES
    ========================== -->

    <div class="seccion">

      <h2 class="titulo-seccion">
        📝 Observaciones
      </h2>

      <div class="campo">

        <label for="observaciones">
          ¿Tienes alguna indicación para tu pedido?
        </label>

        <textarea
          id="observaciones"
          placeholder="Escribe aquí alguna indicación adicional..."
        ></textarea>

      </div>

    </div>


    <!-- =========================
         CONFIRMACIÓN
    ========================== -->

    <div class="confirmacion">

      <input
        type="checkbox"
        id="confirmarDatos"
      >

      <label for="confirmarDatos">

        Confirmo que los datos proporcionados
        son correctos y deseo realizar este pedido.

      </label>

    </div>


    <!-- =========================
         BOTONES
    ========================== -->

    <div class="botones-finales">

      <button
        type="button"
        class="boton-final boton-seguir"
        onclick="seguirComprando()"
      >
        ← Seguir comprando
      </button>


      <button
        type="button"
        class="boton-final boton-finalizar"
        onclick="finalizarPedido()"
      >
        ✅ Finalizar pedido
      </button>

    </div>


  </div>


</div>


<script>

  /* ==================================================
     CONFIGURACIÓN
  ================================================== */

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbx0V_7ievbxYu5OGNcjJf59M3LXRaJbrji67M5JPnWrFkZHI7Mxp7tGXEo4oTblzDV_4g/exec";

  const NUMERO_WHATSAPP =
    "59163336796";

  const URL_PRODUCTOS =
    "https://sites.google.com/view/tomate-importaciones/productos";


  /* ==================================================
     CARRITO
  ================================================== */

  let carrito = [];

  try {

    carrito =
      JSON.parse(
        localStorage.getItem("carritoTomate")
      ) || [];

  } catch (error) {

    carrito = [];

  }


  /* ==================================================
     GUARDAR CARRITO
  ================================================== */

  function guardarCarrito() {

    localStorage.setItem(
      "carritoTomate",
      JSON.stringify(carrito)
    );

  }


  /* ==================================================
     CARGAR PRODUCTO DESDE GOOGLE SHEET
  ================================================== */

  function cargarProductoPorCodigo(codigo) {

    const contenedor =
      document.getElementById("carrito");

    contenedor.innerHTML = `

      <div class="carrito-vacio">

        <div class="icono">
          🔄
        </div>

        <h2>
          Cargando producto...
        </h2>

        <p>
          Estamos consultando el precio actualizado.
        </p>

      </div>

    `;


    window.recibirProductoCarrito =
      function(datos) {

        console.log(
          "Respuesta recibida:",
          datos
        );


        if (
          datos &&
          datos.encontrado === true
        ) {

          agregarProductoAlCarrito({

            codigo:
              String(datos.codigo),

            producto:
              datos.producto,

            unitario:
              Number(datos.unitario),

            mayorista:
              Number(datos.mayorista)

          });


          limpiarCodigoURL();

        } else {

          contenedor.innerHTML = `

            <div class="carrito-vacio">

              <div class="icono">
                ⚠️
              </div>

              <h2>
                Producto no encontrado
              </h2>

              <p>
                Verifica el enlace del producto.
              </p>

              <button
                type="button"
                class="boton-final boton-seguir"
                onclick="seguirComprando()"
              >
                ← Volver a productos
              </button>

            </div>

          `;

        }

      };


    const script =
      document.createElement("script");


    script.type =
      "text/javascript";


    script.src =
      URL_APPS_SCRIPT +
      "?accion=precio" +
      "&codigo=" +
      encodeURIComponent(codigo) +
      "&callback=recibirProductoCarrito" +
      "&nocache=" +
      Date.now();


    script.onerror =
      function() {

        contenedor.innerHTML = `

          <div class="carrito-vacio">

            <div class="icono">
              ⚠️
            </div>

            <h2>
              No se pudo conectar
            </h2>

            <p>
              No fue posible consultar el precio.
              Intenta nuevamente.
            </p>

          </div>

        `;

      };


    document
      .getElementsByTagName("head")[0]
      .appendChild(script);

  }


  /* ==================================================
     AGREGAR PRODUCTO
  ================================================== */

  function agregarProductoAlCarrito(producto) {

    if (
      !producto ||
      !producto.codigo
    ) {

      return;

    }


    const existente =
      carrito.find(
        function(p) {

          return String(p.id) ===
                 String(producto.codigo);

        }
      );


    if (existente) {

      existente.cantidad += 1;

      /*
       Actualizamos los precios por si
       cambiaron en Google Sheet.
      */

      existente.precioUnitario =
        Number(producto.unitario);

      existente.precioMayorista =
        Number(producto.mayorista);

      existente.nombre =
        producto.producto;

    }

    else {

      carrito.push({

        id:
          String(producto.codigo),

        nombre:
          producto.producto,

        precioUnitario:
          Number(producto.unitario),

        precioMayorista:
          Number(producto.mayorista),

        imagen:
          "",

        cantidad:
          1

      });

    }


    guardarCarrito();

    mostrarCarrito();

  }


  /* ==================================================
     MOSTRAR CARRITO
  ================================================== */

  function mostrarCarrito() {

    const contenedor =
      document.getElementById("carrito");


    const contenidoCompra =
      document.getElementById("contenidoCompra");


    if (
      carrito.length === 0
    ) {

      contenedor.innerHTML = `

        <div class="carrito-vacio">

          <div class="icono">
            🛒
          </div>

          <h2>
            Tu carrito está vacío
          </h2>

          <p>
            Agrega productos desde nuestro catálogo.
          </p>

          <button
            type="button"
            class="boton-final boton-seguir"
            onclick="seguirComprando()"
          >
            ← Ver productos
          </button>

        </div>

      `;


      contenidoCompra.style.display =
        "none";

      return;

    }


    contenidoCompra.style.display =
      "block";


    const totalUnidades =
      carrito.reduce(
        function(total, producto) {

          return total +
                 Number(producto.cantidad || 0);

        },
        0
      );


    const usaMayorista =
      totalUnidades >= 3;


    let html = "";

    let total = 0;

    let ahorroTotal = 0;


    /* ==================================================
       MENSAJE MAYORISTA
    ================================================== */

    const mensaje =
      document.getElementById(
        "mensajeMayorista"
      );


    if (usaMayorista) {

      mensaje.className =
        "mensaje-mayorista mayorista-activo";


      mensaje.innerHTML = `

        🎉 ¡PRECIO MAYORISTA ACTIVADO!

        <br>

        Tienes ${totalUnidades} unidades.

        <br>

        Todos los productos tienen precio mayorista.

      `;

    }

    else {

      const faltan =
        3 - totalUnidades;


      mensaje.className =
        "mensaje-mayorista mayorista-inactivo";


      mensaje.innerHTML = `

        🛍️ Agrega ${faltan} unidad(es) más
        para activar el precio mayorista.

      `;

    }


    /* ==================================================
       PRODUCTOS
    ================================================== */

    carrito.forEach(
      function(producto, indice) {

        const precioUnitario =
          Number(producto.precioUnitario || 0);


        const precioMayorista =
          Number(producto.precioMayorista || 0);


        const precioAplicado =
          usaMayorista
          ? precioMayorista
          : precioUnitario;


        const cantidad =
          Number(producto.cantidad || 0);


        const subtotal =
          precioAplicado *
          cantidad;


        const ahorroPorUnidad =
          Math.max(
            0,
            precioUnitario -
            precioMayorista
          );


        const ahorroProducto =
          usaMayorista
          ? ahorroPorUnidad * cantidad
          : 0;


        total += subtotal;

        ahorroTotal += ahorroProducto;


        let imagenHTML = `

          <div class="sin-imagen">
            📦
          </div>

        `;


        /*
         Si posteriormente agregamos URLs de imagen
         al sistema, esta parte las mostrará
         automáticamente.
        */

        if (
          producto.imagen &&
          producto.imagen.trim() !== ""
        ) {

          imagenHTML = `

            <img
              class="imagen-producto"
              src="${escaparHTML(producto.imagen)}"
              alt="${escaparHTML(producto.nombre)}"
            >

          `;

        }


        html += `

          <div class="producto">

            ${imagenHTML}


            <div class="informacion-producto">

              <div class="nombre-producto">

                ${escaparHTML(producto.nombre)}

              </div>


              <div class="precios">

                <div class="precio-linea precio-unitario">

                  Precio unitario:

                  <strong>
                    Bs ${precioUnitario.toFixed(2)}
                  </strong>

                </div>


                <div class="precio-linea precio-mayorista">

                  Precio mayorista:

                  <strong>
                    Bs ${precioMayorista.toFixed(2)}
                  </strong>

                </div>


                ${
                  ahorroPorUnidad > 0
                  ?
                  `

                    <div class="ahorro">

                      Ahorras
                      Bs ${ahorroPorUnidad.toFixed(2)}
                      por unidad

                    </div>

                  `
                  :
                  ""
                }

              </div>


              <div class="precio-aplicado">

                ${
                  usaMayorista
                  ?
                  `

                    Precio aplicado:

                    <strong>
                      Bs ${precioAplicado.toFixed(2)}
                    </strong>

                    <br>

                    <small>
                      Precio mayorista
                    </small>

                  `
                  :
                  `

                    Precio aplicado:

                    <strong>
                      Bs ${precioAplicado.toFixed(2)}
                    </strong>

                    <br>

                    <small>
                      Precio unitario
                    </small>

                  `
                }

              </div>


              <div class="controles">

                <button
                  type="button"
                  class="boton-cantidad"
                  onclick="cambiarCantidad(${indice}, -1)"
                >
                  −
                </button>


                <span class="numero-cantidad">

                  ${cantidad}

                </span>


                <button
                  type="button"
                  class="boton-cantidad"
                  onclick="cambiarCantidad(${indice}, 1)"
                >
                  +
                </button>

              </div>

            </div>


            <div class="lado-derecho">

              <div class="subtotal">

                Bs ${subtotal.toFixed(2)}

              </div>


              ${
                ahorroProducto > 0
                ?
                `

                  <div
                    style="
                      color:#2e7d32;
                      font-size:12px;
                      margin-bottom:8px;
                    "
                  >

                    Ahorras
                    Bs ${ahorroProducto.toFixed(2)}

                  </div>

                `
                :
                ""
              }


              <button
                type="button"
                class="boton-eliminar"
                onclick="eliminarProducto(${indice})"
              >

                🗑 Eliminar

              </button>

            </div>

          </div>

        `;

      }
    );


    contenedor.innerHTML =
      html;


    document.getElementById(
      "totalUnidades"
    ).textContent =
      totalUnidades;


    document.getElementById(
      "ahorroTotal"
    ).textContent =
      "Bs " +
      ahorroTotal.toFixed(2);


    document.getElementById(
      "total"
    ).textContent =
      total.toFixed(2);

  }


  /* ==================================================
     CAMBIAR CANTIDAD
  ================================================== */

  function cambiarCantidad(
    indice,
    cambio
  ) {

    if (
      !carrito[indice]
    ) {

      return;

    }


    carrito[indice].cantidad =
      Number(carrito[indice].cantidad) +
      Number(cambio);


    if (
      carrito[indice].cantidad <= 0
    ) {

      carrito.splice(
        indice,
        1
      );

    }


    guardarCarrito();

    mostrarCarrito();

  }


  /* ==================================================
     ELIMINAR
  ================================================== */

  function eliminarProducto(
    indice
  ) {

    if (
      !carrito[indice]
    ) {

      return;

    }


    carrito.splice(
      indice,
      1
    );


    guardarCarrito();

    mostrarCarrito();

  }


  /* ==================================================
     VACIAR CARRITO
  ================================================== */

  function vaciarCarrito() {

    if (
      carrito.length === 0
    ) {

      return;

    }


    const confirmar =
      confirm(
        "¿Seguro que deseas vaciar todo el carrito?"
      );


    if (!confirmar) {

      return;

    }


    carrito = [];

    guardarCarrito();

    mostrarCarrito();

  }


  /* ==================================================
     ENTREGA
  ================================================== */

  function mostrarDatosEntrega() {

    const tipo =
      document.getElementById(
        "tipoEntrega"
      ).value;


    const datosDelivery =
      document.getElementById(
        "datosDelivery"
      );


    const datosTienda =
      document.getElementById(
        "datosTienda"
      );


    if (
      tipo === "Delivery"
    ) {

      datosDelivery.style.display =
        "block";

      datosTienda.style.display =
        "none";

    }

    else if (
      tipo === "Entrega en tienda"
    ) {

      datosDelivery.style.display =
        "none";

      datosTienda.style.display =
        "block";

    }

    else {

      datosDelivery.style.display =
        "none";

      datosTienda.style.display =
        "none";

    }

  }


  document
    .getElementById("tipoEntrega")
    .addEventListener(
      "change",
      mostrarDatosEntrega
    );


  /* ==================================================
     SEGUIR COMPRANDO
  ================================================== */

  function seguirComprando() {

    window.location.href =
      URL_PRODUCTOS;

  }


  /* ==================================================
     FINALIZAR PEDIDO
  ================================================== */

  function finalizarPedido() {

    if (
      carrito.length === 0
    ) {

      alert(
        "Tu carrito está vacío."
      );

      return;

    }


    const nombre =
      document.getElementById(
        "nombreCliente"
      ).value.trim();


    const whatsapp =
      document.getElementById(
        "whatsappCliente"
      ).value.trim();


    const otroContacto =
      document.getElementById(
        "otroContacto"
      ).value.trim();


    const correo =
      document.getElementById(
        "correoCliente"
      ).value.trim();


    const tipoEntrega =
      document.getElementById(
        "tipoEntrega"
      ).value;


    const observaciones =
      document.getElementById(
        "observaciones"
      ).value.trim();


    const confirmar =
      document.getElementById(
        "confirmarDatos"
      ).checked;


    /* =========================
       VALIDACIONES
    ========================== */

    if (!nombre) {

      alert(
        "Por favor, ingresa tu nombre completo."
      );

      document
        .getElementById("nombreCliente")
        .focus();

      return;

    }


    if (!whatsapp) {

      alert(
        "Por favor, ingresa tu número de WhatsApp."
      );

      document
        .getElementById("whatsappCliente")
        .focus();

      return;

    }


    if (!tipoEntrega) {

      alert(
        "Por favor, selecciona cómo deseas recibir tu pedido."
      );

      document
        .getElementById("tipoEntrega")
        .focus();

      return;

    }


    let datosEntrega = "";


    /* =========================
       DELIVERY
    ========================== */

    if (
      tipoEntrega === "Delivery"
    ) {

      const ciudad =
        document.getElementById(
          "ciudad"
        ).value.trim();


      const zona =
        document.getElementById(
          "zona"
        ).value.trim();


      const direccion =
        document.getElementById(
          "direccion"
        ).value.trim();


      const referencia =
        document.getElementById(
          "referencia"
        ).value.trim();


      const recibe =
        document.getElementById(
          "recibe"
        ).value.trim();


      if (!ciudad) {

        alert(
          "Por favor, ingresa la ciudad."
        );

        return;

      }


      if (!zona) {

        alert(
          "Por favor, ingresa la zona o barrio."
        );

        return;

      }


      if (!direccion) {

        alert(
          "Por favor, ingresa la dirección."
        );

        return;

      }


      if (!recibe) {

        alert(
          "Por favor, indica quién recibirá el pedido."
        );

        return;

      }


      datosEntrega =
        "🚚 *DELIVERY*" +
        "\n" +
        "Ciudad: " +
        ciudad +
        "\n" +
        "Zona/Barrio: " +
        zona +
        "\n" +
        "Dirección: " +
        direccion +
        "\n" +
        "Referencia: " +
        (referencia || "No indicada") +
        "\n" +
        "Recibe: " +
        recibe;

    }


    /* =========================
       TIENDA
    ========================== */

    if (
      tipoEntrega ===
      "Entrega en tienda"
    ) {

      const persona =
        document.getElementById(
          "personaRecoge"
        ).value.trim();


      if (!persona) {

        alert(
          "Por favor, indica quién recogerá el pedido."
        );

        return;

      }


      datosEntrega =
        "🏪 *ENTREGA EN TIENDA*" +
        "\n" +
        "Persona que recogerá: " +
        persona;

    }


    /* =========================
       CONFIRMACIÓN
    ========================== */

    if (!confirmar) {

      alert(
        "Debes confirmar que tus datos son correctos."
      );

      return;

    }


    /* =========================
       CALCULAR PEDIDO
    ========================== */

    const totalUnidades =
      carrito.reduce(
        function(total, producto) {

          return total +
                 Number(producto.cantidad);

        },
        0
      );


    const usaMayorista =
      totalUnidades >= 3;


    let total = 0;

    let ahorro = 0;


    let mensaje =
      "🛒 *NUEVO PEDIDO - TOMATE IMPORTACIONES S.R.L.*\n\n";


    mensaje +=
      "👤 *DATOS DEL CLIENTE*\n";

    mensaje +=
      "Nombre: " +
      nombre +
      "\n";

    mensaje +=
      "WhatsApp: " +
      whatsapp +
      "\n";


    if (otroContacto) {

      mensaje +=
        "Otro contacto: " +
        otroContacto +
        "\n";

    }


    if (correo) {

      mensaje +=
        "Correo: " +
        correo +
        "\n";

    }


    mensaje +=
      "\n";


    mensaje +=
      "📦 *PRODUCTOS*\n\n";


    carrito.forEach(
      function(producto, indice) {

        const unitario =
          Number(producto.precioUnitario);


        const mayorista =
          Number(producto.precioMayorista);


        const precio =
          usaMayorista
          ? mayorista
          : unitario;


        const subtotal =
          precio *
          Number(producto.cantidad);


        const ahorroProducto =
          usaMayorista
          ?
          Math.max(
            0,
            unitario - mayorista
          ) *
          Number(producto.cantidad)
          :
          0;


        total += subtotal;

        ahorro += ahorroProducto;


        mensaje +=
          "*" +
          (indice + 1) +
          ". " +
          producto.nombre +
          "*\n";


        mensaje +=
          "Código: " +
          producto.id +
          "\n";


        mensaje +=
          "Cantidad: " +
          producto.cantidad +
          "\n";


        mensaje +=
          "Precio unitario: Bs " +
          unitario.toFixed(2) +
          "\n";


        mensaje +=
          "Precio mayorista: Bs " +
          mayorista.toFixed(2) +
          "\n";


        mensaje +=
          "Precio aplicado: Bs " +
          precio.toFixed(2) +
          "\n";


        mensaje +=
          "Subtotal: Bs " +
          subtotal.toFixed(2) +
          "\n";


        mensaje +=
          "\n";

      }
    );


    mensaje +=
      "📊 *RESUMEN*\n";


    mensaje +=
      "Total de unidades: " +
      totalUnidades +
      "\n";


    mensaje +=
      "Precio mayorista: " +
      (
        usaMayorista
        ? "SÍ"
        : "NO"
      ) +
      "\n";


    mensaje +=
      "Ahorro: Bs " +
      ahorro.toFixed(2) +
      "\n";


    mensaje +=
      "💰 *TOTAL: Bs " +
      total.toFixed(2) +
      "*\n\n";


    mensaje +=
      datosEntrega +
      "\n\n";


    if (observaciones) {

      mensaje +=
        "📝 *OBSERVACIONES*\n" +
        observaciones +
        "\n\n";

    }


    mensaje +=
      "✅ Cliente confirmó que los datos son correctos.";


    /* =========================
       ABRIR WHATSAPP
    ========================== */

    const urlWhatsApp =
      "https://wa.me/" +
      NUMERO_WHATSAPP +
      "?text=" +
      encodeURIComponent(mensaje);


    window.open(
      urlWhatsApp,
      "_blank"
    );

  }


  /* ==================================================
     LIMPIAR CÓDIGO DE URL
  ================================================== */

  function limpiarCodigoURL() {

    try {

      const url =
        new URL(
          window.location.href
        );


      url.searchParams.delete(
        "codigo"
      );


      window.history.replaceState(
        {},
        document.title,
        url.toString()
      );

    } catch (error) {

      console.log(
        "No se pudo limpiar la URL."
      );

    }

  }


  /* ==================================================
     ESCAPAR HTML
  ================================================== */

  function escaparHTML(texto) {

    return String(
      texto == null
      ? ""
      : texto
    )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

  }


  /* ==================================================
     INICIAR
  ================================================== */

  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const codigo =
    parametros.get(
      "codigo"
    );


  if (codigo) {

    cargarProductoPorCodigo(
      codigo
    );

  }

  else {

    mostrarCarrito();

  }

</script>
