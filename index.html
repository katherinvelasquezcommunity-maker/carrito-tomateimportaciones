<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMATE IMPORTACIONES S.R.L.</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8e1;
  color:#333;
}

.contenedor{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.encabezado{
  background:#9b0000;
  color:white;
  text-align:center;
  padding:25px 15px;
  border-radius:0 0 15px 15px;
}

.encabezado h1{
  margin:0;
  font-size:28px;
}

.encabezado p{
  margin:8px 0 0;
  color:#ffd700;
  font-style:italic;
  font-size:17px;
}

h2{
  color:#9b0000;
  text-align:center;
  margin-top:25px;
}

.mensaje-mayorista{
  background:#fff3cd;
  border:1px solid #d4af37;
  padding:15px;
  border-radius:10px;
  text-align:center;
  margin:20px 0;
  font-weight:bold;
}

.activado{
  background:#e8f5e9;
  border:2px solid #2e7d32;
  color:#1b5e20;
  padding:18px;
  border-radius:12px;
  text-align:center;
  margin:20px 0;
  font-weight:bold;
}

.activado .titulo{
  font-size:20px;
  margin-bottom:10px;
}

.activado .ahorro{
  color:#9b0000;
  font-size:20px;
  margin-top:8px;
}

.producto{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
}

.producto h3{
  margin-top:0;
  color:#9b0000;
}

.precio{
  margin:6px 0;
}

.precio-mayorista{
  color:#9b0000;
  font-weight:bold;
}

.precio-activado{
  color:#2e7d32;
  font-weight:bold;
}

.controles{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.btn-cantidad{
  background:#9b0000;
  color:white;
}

.btn-eliminar{
  background:#555;
  color:white;
}

.btn-vaciar{
  background:#333;
  color:white;
  width:100%;
  margin-top:15px;
}

.cantidad{
  font-size:18px;
  font-weight:bold;
}

.total{
  background:#9b0000;
  color:white;
  padding:18px;
  border-radius:10px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
}

.formulario{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  border:1px solid #ddd;
}

.formulario label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}

.formulario input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.opciones-entrega{
  margin-top:10px;
}

.opciones-entrega label{
  display:inline-block;
  font-weight:normal;
  margin-right:15px;
}

.botones-finales{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn-comprar{
  flex:1;
  background:#9b0000;
  color:white;
  font-size:16px;
}

.btn-seguir{
  flex:1;
  background:#d4af37;
  color:#222;
  font-size:16px;
  text-align:center;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  box-sizing:border-box;
}

.vacio{
  text-align:center;
  padding:40px 10px;
  font-size:18px;
  color:#777;
}

.oculto{
  display:none;
}

@media(max-width:600px){
  .botones-finales{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="encabezado">
  <h1>TOMATE IMPORTACIONES S.R.L.</h1>
  <p>Calidad importada, confianza garantizada</p>
</div>

<div class="contenedor">

<h2>Mi carrito</h2>

<div class="mensaje-mayorista">
  Precio mayorista: Lleva 3 unidades o más, combinando diferentes productos,
  y se aplicará automáticamente el precio mayorista.
</div>

<div id="estadoMayorista"></div>

<div id="carrito"></div>

<div id="zonaCompra" class="oculto">

  <div id="total" class="total"></div>

  <button class="btn-vaciar" onclick="vaciarCarrito()">
    VACIAR CARRITO
  </button>

  <div class="formulario">

    <h2>Datos del cliente</h2>

    <label>Nombre del cliente</label>
    <input
      type="text"
      id="nombreCliente"
      placeholder="Escribe tu nombre">

    <label>WhatsApp</label>
    <input
      type="tel"
      id="whatsappCliente"
      placeholder="Ej.: 70000000">

    <label>Método de entrega</label>

    <div class="opciones-entrega">

      <label>
        <input
          type="radio"
          name="entrega"
          value="Delivery"
          onchange="mostrarDelivery()">
        Delivery
      </label>

      <label>
        <input
          type="radio"
          name="entrega"
          value="Entrega en tienda"
          onchange="mostrarDelivery()">
        Entrega en tienda
      </label>

    </div>

    <div id="datosDelivery" class="oculto">

      <label>Dirección</label>
      <input
        type="text"
        id="direccion"
        placeholder="Escribe tu dirección">

      <label>Referencia</label>
      <input
        type="text"
        id="referencia"
        placeholder="Ej.: cerca de...">

    </div>

  </div>

  <div class="botones-finales">

    <a
      class="btn-seguir"
      href="https://sites.google.com/view/tomate-importaciones/productos">
      SEGUIR COMPRANDO
    </a>

    <button
      class="btn-comprar"
      onclick="finalizarPedido()">
      FINALIZAR PEDIDO
    </button>

  </div>

</div>

</div>

<script>

const CLAVE_CARRITO = "tomate_carrito";

const NUMERO_WHATSAPP = "59163336796";

let carrito = JSON.parse(
  localStorage.getItem(CLAVE_CARRITO) || "[]"
);

function obtenerProductoInicial(){

  const parametros = new URLSearchParams(
    window.location.search
  );

  const nombre = parametros.get("nombre");

  const unitario = Number(
    parametros.get("unitario")
  );

  const mayorista = Number(
    parametros.get("mayorista")
  );

  if(
    nombre &&
    !isNaN(unitario) &&
    !isNaN(mayorista)
  ){

    const existente = carrito.find(
      p => p.nombre === nombre
    );

    if(existente){

      existente.cantidad++;

    }else{

      carrito.push({
        nombre:nombre,
        unitario:unitario,
        mayorista:mayorista,
        cantidad:1
      });

    }

    guardarCarrito();

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );
  }
}

function guardarCarrito(){

  localStorage.setItem(
    CLAVE_CARRITO,
    JSON.stringify(carrito)
  );

}

function calcularCantidadTotal(){

  return carrito.reduce(
    (total,p) => total + p.cantidad,
    0
  );

}

function calcularTotales(){

  let totalUnitario = 0;
  let totalMayorista = 0;

  carrito.forEach(producto => {

    totalUnitario +=
      producto.unitario * producto.cantidad;

    totalMayorista +=
      producto.mayorista * producto.cantidad;

  });

  return {
    unitario:totalUnitario,
    mayorista:totalMayorista
  };

}

function renderizarCarrito(){

  const contenedor =
    document.getElementById("carrito");

  const zonaCompra =
    document.getElementById("zonaCompra");

  const estadoMayorista =
    document.getElementById("estadoMayorista");

  if(carrito.length === 0){

    contenedor.innerHTML =
      '<div class="vacio">Tu carrito está vacío.</div>';

    estadoMayorista.innerHTML = "";

    zonaCompra.classList.add("oculto");

    return;
  }

  zonaCompra.classList.remove("oculto");

  const cantidadTotal =
    calcularCantidadTotal();

  const usaMayorista =
    cantidadTotal >= 3;

  const totales =
    calcularTotales();

  const ahorro =
    totales.unitario - totales.mayorista;

  if(usaMayorista){

    estadoMayorista.innerHTML = `
      <div class="activado">

        <div class="titulo">
          🏷️ ¡PRECIO MAYORISTA ACTIVADO!
        </div>

        Tu compra tiene
        ${cantidadTotal}
        unidades.

        <div class="ahorro">
          🎉 ¡Estás ahorrando Bs
          ${ahorro.toFixed(2)}!
        </div>

      </div>
    `;

  }else{

    const faltan =
      3 - cantidadTotal;

    estadoMayorista.innerHTML = `
      <div class="mensaje-mayorista">

        🔔 Te faltan
        <strong>${faltan}</strong>
        unidad${faltan === 1 ? "" : "es"}
        para activar el precio mayorista.

      </div>
    `;

  }

  let html = "";

  let totalAplicado = 0;

  carrito.forEach((producto,index)=>{

    const precioAplicado =
      usaMayorista
      ? producto.mayorista
      : producto.unitario;

    const subtotal =
      precioAplicado * producto.cantidad;

    totalAplicado += subtotal;

    html += `
      <div class="producto">

        <h3>${producto.nombre}</h3>

        <div class="precio">
          Precio unitario:
          <strong>
            Bs ${producto.unitario.toFixed(2)}
          </strong>
        </div>

        <div class="precio precio-mayorista">
          Precio mayorista:
          Bs ${producto.mayorista.toFixed(2)}
        </div>

        <div class="${
          usaMayorista
          ? "precio-activado"
          : ""
        }">

          ${
            usaMayorista
            ? "🏷️ Precio mayorista aplicado:"
            : "Precio aplicado:"
          }

          <strong>
            Bs ${precioAplicado.toFixed(2)}
          </strong>

        </div>

        <div>
          Subtotal:
          <strong>
            Bs ${subtotal.toFixed(2)}
          </strong>
        </div>

        <div class="controles">

          <button
            class="btn-cantidad"
            onclick="cambiarCantidad(${index},-1)">
            −
          </button>

          <span class="cantidad">
            ${producto.cantidad}
          </span>

          <button
            class="btn-cantidad"
            onclick="cambiarCantidad(${index},1)">
            +
          </button>

          <button
            class="btn-eliminar"
            onclick="eliminarProducto(${index})">
            Eliminar
          </button>

        </div>

      </div>
    `;

  });

  contenedor.innerHTML = html;

  document.getElementById("total").innerHTML =
    "TOTAL: Bs " +
    totalAplicado.toFixed(2);

}

function cambiarCantidad(index,cambio){

  carrito[index].cantidad += cambio;

  if(carrito[index].cantidad <= 0){

    carrito.splice(index,1);

  }

  guardarCarrito();

  renderizarCarrito();

}

function eliminarProducto(index){

  carrito.splice(index,1);

  guardarCarrito();

  renderizarCarrito();

}

function vaciarCarrito(){

  if(confirm("¿Quieres vaciar todo el carrito?")){

    carrito = [];

    guardarCarrito();

    renderizarCarrito();

  }

}

function mostrarDelivery(){

  const opcion =
    document.querySelector(
      'input[name="entrega"]:checked'
    );

  const datos =
    document.getElementById("datosDelivery");

  if(
    opcion &&
    opcion.value === "Delivery"
  ){

    datos.classList.remove("oculto");

  }else{

    datos.classList.add("oculto");

  }

}

function finalizarPedido(){

  if(carrito.length === 0){

    alert("El carrito está vacío.");

    return;

  }

  const nombre =
    document
      .getElementById("nombreCliente")
      .value
      .trim();

  const whatsapp =
    document
      .getElementById("whatsappCliente")
      .value
      .trim();

  const opcion =
    document.querySelector(
      'input[name="entrega"]:checked'
    );

  if(!nombre){

    alert(
      "Por favor, coloca tu nombre."
    );

    return;

  }

  if(!whatsapp){

    alert(
      "Por favor, coloca tu número de WhatsApp."
    );

    return;

  }

  if(!opcion){

    alert(
      "Por favor, selecciona el método de entrega."
    );

    return;

  }

  let direccion = "";
  let referencia = "";

  if(
    opcion.value === "Delivery"
  ){

    direccion =
      document
        .getElementById("direccion")
        .value
        .trim();

    referencia =
      document
        .getElementById("referencia")
        .value
        .trim();

    if(!direccion){

      alert(
        "Por favor, coloca tu dirección."
      );

      return;

    }

  }

  const cantidadTotal =
    calcularCantidadTotal();

  const usaMayorista =
    cantidadTotal >= 3;

  let mensaje =
    "🛒 *NUEVO PEDIDO - TOMATE IMPORTACIONES S.R.L.*%0A%0A";

  mensaje +=
    "👤 *Cliente:* " +
    encodeURIComponent(nombre) +
    "%0A";

  mensaje +=
    "📱 *WhatsApp:* " +
    encodeURIComponent(whatsapp) +
    "%0A";

  mensaje +=
    "🚚 *Entrega:* " +
    encodeURIComponent(opcion.value) +
    "%0A";

  if(
    opcion.value === "Delivery"
  ){

    mensaje +=
      "📍 *Dirección:* " +
      encodeURIComponent(direccion) +
      "%0A";

    if(referencia){

      mensaje +=
        "📌 *Referencia:* " +
        encodeURIComponent(referencia) +
        "%0A";

    }

  }

  mensaje +=
    "%0A🛍️ *PRODUCTOS:*%0A";

  let total = 0;

  carrito.forEach(producto=>{

    const precio =
      usaMayorista
      ? producto.mayorista
      : producto.unitario;

    const subtotal =
      precio * producto.cantidad;

    total += subtotal;

    mensaje +=
      "• " +
      encodeURIComponent(producto.nombre) +
      " x" +
      producto.cantidad +
      " — Bs " +
      subtotal.toFixed(2) +
      "%0A";

  });

  mensaje += "%0A";

  if(usaMayorista){

    const totales =
      calcularTotales();

    const ahorro =
      totales.unitario -
      totales.mayorista;

    mensaje +=
      "🏷️ *PRECIO MAYORISTA ACTIVADO*%0A";

    mensaje +=
      "💸 *AHORRO: Bs " +
      ahorro.toFixed(2) +
      "*%0A";

  }else{

    mensaje +=
      "🏷️ Precio unitario aplicado%0A";

  }

  mensaje +=
    "💰 *TOTAL: Bs " +
    total.toFixed(2) +
    "*%0A";

  const url =
    "https://wa.me/" +
    NUMERO_WHATSAPP +
    "?text=" +
    mensaje;

  window.location.href = url;

}

obtenerProductoInicial();

renderizarCarrito();

</script>

</body>
</html>
